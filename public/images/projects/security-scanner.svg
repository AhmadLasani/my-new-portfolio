<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="100%" stop-color="#02060D" />
    </linearGradient>
    <linearGradient id="sidebarBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040912" />
      <stop offset="100%" stop-color="#02050A" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0080FF" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00A8E8" />
      <stop offset="100%" stop-color="#007EA7" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="url(#bgMain)" />

  <!-- SIDEBAR (Left 240px) -->
  <g transform="translate(0, 0)">
    <rect width="240" height="900" fill="url(#sidebarBg)" stroke="#0E1A2B" stroke-width="1" />
    
    <!-- Logo: SecureCheck -->
    <g transform="translate(24, 30)">
      <path d="M 0 6 C 0 2, 8 0, 16 0 C 24 0, 32 2, 32 6 C 32 18, 24 28, 16 32 C 8 28, 0 18, 0 6 Z" fill="#00D2FF" opacity="0.9" />
      <path d="M 6 10 C 6 7, 11 5, 16 5 C 21 5, 26 7, 26 10 C 26 18, 20 23, 16 26 C 12 23, 6 18, 6 10 Z" fill="#040912" />
      <text x="44" y="22" fill="#FFFFFF" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.5">Secure<tspan fill="#00D2FF">Check</tspan></text>
    </g>

    <!-- Sidebar Navigation Menu -->
    <g transform="translate(16, 100)">
      <!-- Item 1: DASHBOARD (Active) -->
      <g transform="translate(0, 0)">
        <rect width="208" height="42" rx="8" fill="#0E223D" />
        <!-- Dashboard grid icon -->
        <g transform="translate(16, 12)" stroke="#00D2FF" stroke-width="2" fill="none">
          <rect x="0" y="0" width="6" height="6" rx="1" />
          <rect x="10" y="0" width="6" height="6" rx="1" />
          <rect x="0" y="10" width="6" height="6" rx="1" />
          <rect x="10" y="10" width="6" height="6" rx="1" />
        </g>
        <text x="44" y="26" fill="#00D2FF" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">DASHBOARD</text>
      </g>

      <!-- Item 2: CHECK WEBSITE -->
      <g transform="translate(0, 52)">
        <circle cx="23" cy="21" r="6" stroke="#64748B" stroke-width="2" fill="none" />
        <line x1="27" y1="25" x2="33" y2="31" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
        <text x="44" y="26" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">CHECK WEBSITE</text>
      </g>

      <!-- Item 3: SSL / TLS -->
      <g transform="translate(0, 104)">
        <rect x="17" y="17" width="12" height="10" rx="2" stroke="#64748B" stroke-width="2" fill="none" />
        <path d="M 19 17 L 19 13 C 19 10, 27 10, 27 13 L 27 17" stroke="#64748B" stroke-width="2" fill="none" />
        <text x="44" y="26" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">SSL / TLS</text>
      </g>

      <!-- Item 4: SCAN HISTORY -->
      <g transform="translate(0, 156)">
        <circle cx="23" cy="21" r="7" stroke="#64748B" stroke-width="2" fill="none" />
        <polyline points="23,17 23,21 26,23" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round" />
        <text x="44" y="26" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">SCAN HISTORY</text>
      </g>

      <!-- Item 5: THREATS -->
      <g transform="translate(0, 208)">
        <path d="M 17 25 L 23 15 L 29 25 Z" stroke="#64748B" stroke-width="2" fill="none" />
        <text x="44" y="26" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">THREATS</text>
      </g>

      <!-- Item 6: REPORTS -->
      <g transform="translate(0, 260)">
        <rect x="18" y="15" width="10" height="14" rx="1" stroke="#64748B" stroke-width="2" fill="none" />
        <text x="44" y="26" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">REPORTS</text>
      </g>

      <!-- Item 7: ANALYTICS -->
      <g transform="translate(0, 312)">
        <line x1="18" y1="28" x2="18" y2="23" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
        <line x1="23" y1="28" x2="23" y2="18" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
        <line x1="28" y1="28" x2="28" y2="15" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
        <text x="44" y="26" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">ANALYTICS</text>
      </g>

      <!-- Item 8: SETTINGS -->
      <g transform="translate(0, 364)">
        <circle cx="23" cy="21" r="6" stroke="#64748B" stroke-width="2" fill="none" />
        <text x="44" y="26" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">SETTINGS</text>
      </g>
    </g>

    <!-- Bottom: Collapse -->
    <g transform="translate(24, 850)">
      <path d="M 8 0 L 2 6 L 8 12" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round" />
      <text x="24" y="10" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">COLLAPSE</text>
    </g>
  </g>

  <!-- MAIN DASHBOARD CONTENT AREA -->
  <g transform="translate(280, 0)">
    
    <!-- Top Header Bar -->
    <g transform="translate(0, 24)">
      <text x="0" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="800" letter-spacing="1">WEBSITE SECURITY ANALYSIS</text>
      <circle cx="270" cy="15" r="4" fill="#10B981" />
      <text x="282" y="19" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">ALL SYSTEMS OPERATIONAL</text>

      <!-- User Badge Right: Ahmad -->
      <g transform="translate(1040, 0)">
        <circle cx="16" cy="16" r="16" fill="#1E293B" stroke="#00D2FF" stroke-width="1.5" />
        <text x="16" y="21" fill="#00D2FF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">A</text>
        <text x="42" y="21" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600">Ahmad</text>
      </g>
    </g>

    <!-- Hero Content (Center) -->
    <g transform="translate(0, 160)">
      
      <!-- Top Pill: • ALL INFRASTRUCTURE NODES ACTIVE • -->
      <g transform="translate(360, 0)">
        <rect width="360" height="30" rx="15" fill="#031526" stroke="#0E3359" stroke-width="1.5" />
        <circle cx="20" cy="15" r="3" fill="#00D2FF" />
        <text x="180" y="20" fill="#00D2FF" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">ALL INFRASTRUCTURE NODES ACTIVE</text>
        <circle cx="340" cy="15" r="3" fill="#00D2FF" />
      </g>

      <!-- Giant Headline: Is That Website Safe? -->
      <g transform="translate(540, 90)">
        <text x="0" y="0" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
          <tspan fill="#FFFFFF">Is That Website </tspan>
          <tspan fill="#00D2FF">Safe?</tspan>
        </text>
      </g>

      <!-- Subtitle -->
      <text x="540" y="140" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="16" font-weight="400">
        Instantly scan any URL for SSL issues, malware, phishing, DNS vulnerabilities, and more — all in one place.
      </text>

      <!-- URL Input & Scan Now Button Box -->
      <g transform="translate(190, 185)">
        <rect width="700" height="62" rx="12" fill="#061222" stroke="#0E223D" stroke-width="2" />
        <!-- Globe icon -->
        <circle cx="36" cy="31" r="10" stroke="#64748B" stroke-width="2" fill="none" />
        <ellipse cx="36" cy="31" rx="4" ry="10" stroke="#64748B" stroke-width="1.5" fill="none" />
        <line x1="26" y1="31" x2="46" y2="31" stroke="#64748B" stroke-width="1.5" />
        <!-- Placeholder text -->
        <text x="60" y="36" fill="#64748B" font-family="sans-serif" font-size="14">Enter website URL (e.g. https://example.com)</text>
        
        <!-- SCAN NOW Button -->
        <rect x="536" y="8" width="154" height="46" rx="8" fill="url(#btnGrad)" />
        <circle cx="566" cy="31" r="6" stroke="#FFFFFF" stroke-width="2" fill="none" />
        <line x1="570" y1="35" x2="576" y2="41" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
        <text x="624" y="36" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="800" letter-spacing="1" text-anchor="middle">SCAN NOW</text>
      </g>

      <!-- 3 Metrics in Row -->
      <g transform="translate(240, 310)">
        <!-- Metric 1: 10M+ -->
        <g transform="translate(80, 0)">
          <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="34" font-weight="900">10M+</text>
          <text x="0" y="24" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">SCANS DONE</text>
        </g>
        <!-- Metric 2: 99.9% -->
        <g transform="translate(300, 0)">
          <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="34" font-weight="900">99.9%</text>
          <text x="0" y="24" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">UPTIME</text>
        </g>
        <!-- Metric 3: 1.8s -->
        <g transform="translate(520, 0)">
          <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="34" font-weight="900">1.8s</text>
          <text x="0" y="24" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">AVG SCAN TIME</text>
        </g>
      </g>

      <!-- Bottom Status Cards (Sites Scanned Today & Threats Blocked) -->
      <g transform="translate(0, 420)">
        <!-- Card 1: Sites Scanned Today -->
        <g transform="translate(40, 0)">
          <rect width="480" height="140" rx="14" fill="#040C1A" stroke="#0E223D" stroke-width="1.5" />
          <path d="M 32 30 L 40 24 L 48 30 C 48 38, 44 44, 40 48 C 36 44, 32 38, 32 30 Z" stroke="#00D2FF" stroke-width="2" fill="none" />
          <text x="60" y="38" fill="#00D2FF" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">SITES SCANNED TODAY</text>
          <text x="32" y="96" fill="#FFFFFF" font-family="sans-serif" font-size="44" font-weight="900">4,921</text>
        </g>
        <!-- Card 2: Threats Blocked -->
        <g transform="translate(560, 0)">
          <rect width="480" height="140" rx="14" fill="#040C1A" stroke="#0E223D" stroke-width="1.5" />
          <path d="M 32 30 L 40 24 L 48 30 C 48 38, 44 44, 40 48 C 36 44, 32 38, 32 30 Z" stroke="#10B981" stroke-width="2" fill="none" />
          <text x="60" y="38" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">THREATS BLOCKED</text>
          <text x="32" y="96" fill="#10B981" font-family="sans-serif" font-size="44" font-weight="900">1,289</text>
        </g>
      </g>

    </g>
  </g>
</svg>
